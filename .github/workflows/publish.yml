name: Publish

# A push to main that changes package.json releases its version when the tag v<version> does not exist yet.
# npm trusted publishing is bound to this filename, so keep it.
on:
  push:
    branches: [main]
    paths: [package.json]

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Read the version and look for its tag
        id: version
        run: node scripts/release-version.ts

  publish:
    needs: check
    if: needs.check.outputs.tag != ''
    environment: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Check the release notes
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/release-notes.ts
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm test
      - run: npm run test:d1
      - run: npm exec -- vite build
        env:
          POLYLINEDB_BUILD_WITHOUT_ACCESS: '1'
          CLOUDFLARE_VITE_FORCE_BUILD_OUTPUT: 'true'
      - run: node test/worker.integration.ts
      - run: npm audit
      - name: Verify the distributable
        run: npm run test:package -- "$RUNNER_TEMP/polylinedb.tgz"
      - name: Publish the verified tarball with OIDC
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_TARBALL: ${{ runner.temp }}/polylinedb.tgz
        run: |
          decision="$(node scripts/npm-release.ts)"
          if [ "$decision" = publish ]; then
            npm publish "$RELEASE_TARBALL" --dry-run --ignore-scripts --access public --registry=https://registry.npmjs.org/
            npm publish "$RELEASE_TARBALL" --ignore-scripts --access public --registry=https://registry.npmjs.org/
          fi
      - name: Verify registry integrity
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          for attempt in {1..90}; do
            if npm view "polylinedb@$RELEASE_VERSION" dist.integrity --json --prefer-online --registry=https://registry.npmjs.org/ > "$RUNNER_TEMP/registry-integrity.json" && [ -s "$RUNNER_TEMP/registry-integrity.json" ]; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              exit 1
            fi
            sleep 10
          done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const root = process.env.RUNNER_TEMP;
          const expected = 'sha512-' + createHash('sha512').update(readFileSync(`${root}/polylinedb.tgz`)).digest('base64');
          assert.equal(JSON.parse(readFileSync(`${root}/registry-integrity.json`, 'utf8')), expected);
          NODE

  release:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Write the release notes
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_NOTES_OUT: ${{ runner.temp }}/release-notes.md
        run: node scripts/release-notes.ts
      - name: Create the annotated tag and GitHub Release
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.ts
