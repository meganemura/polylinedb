name: Check

# main only receives fast-forwards of a queue tip whose Check already passed, so Check does not run again there.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Each OS and Node pair runs four suites as separate jobs, so the slowest suite sets the wall time.
  check:
    name: ${{ matrix.suite }} (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        node: ['24.20.0', '26.7.0']
        suite: [static, unit, d1, package]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - if: matrix.suite == 'static'
        run: npm run typecheck
      - if: matrix.suite == 'static'
        run: npm run check:architecture
      - if: matrix.suite == 'static'
        run: npm run check:ui-latency
      - if: matrix.suite == 'unit'
        run: npm test
      - if: matrix.suite == 'unit'
        run: npm run test:scenarios
      - if: matrix.suite == 'd1'
        run: npm run test:d1
      - if: matrix.suite == 'package'
        run: npm exec -- vite build
        env:
          POLYLINEDB_BUILD_WITHOUT_ACCESS: '1'
          CLOUDFLARE_VITE_FORCE_BUILD_OUTPUT: 'true'
      - if: matrix.suite == 'package'
        run: node test/worker.integration.ts
      - if: matrix.suite == 'package'
        run: npm run test:package

  commit-messages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - run: node scripts/commit-messages.ts
        env:
          COMMIT_RANGE_BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COMMIT_RANGE_AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
