<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f1e8">
    <title>Attention</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="paper">
      <h1>Attention</h1>
      <form id="attention">
        <fieldset>
          <legend class="visually-hidden">Select an item</legend>
          <ul class="attention-list">
            <li>
              <label class="attention-row">
                <input type="radio" name="issue" value="fixture-1" checked>
                <span class="row-text">
                  <span class="reason">Decide the next step</span>
                  <span class="actor">Claude</span>
                </span>
              </label>
            </li>
            <li>
              <label class="attention-row">
                <input type="radio" name="issue" value="fixture-2">
                <span class="row-text">
                  <span class="reason">Check the connection</span>
                  <span class="actor">Codex</span>
                </span>
              </label>
            </li>
            <li>
              <label class="attention-row">
                <input type="radio" name="issue" value="fixture-3">
                <span class="row-text">
                  <span class="reason">Choose who takes over</span>
                  <span class="actor">Rocky</span>
                </span>
              </label>
            </li>
          </ul>
        </fieldset>
        <footer class="dispatch-area">
          <button type="submit" class="dispatch">Dispatch</button>
        </footer>
      </form>
    </main>
  </body>
</html>
