<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f1e8">
    <title>Attention</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main class="paper">
      <h1>Attention</h1>
      <form id="attention" aria-busy="true">
        <fieldset aria-label="Attention items">
          <ul class="attention-list"></ul>
          <p class="quiet-note" hidden></p>
        </fieldset>
        <footer class="dispatch-area">
          <button type="submit" class="dispatch" disabled>Dispatch</button>
        </footer>
      </form>
    </main>
    <template id="attention-row">
      <li>
        <label class="attention-row">
          <input type="radio" name="issue">
          <span class="row-text">
            <span class="reason"></span>
            <span class="actor"></span>
          </span>
        </label>
      </li>
    </template>
  </body>
</html>
